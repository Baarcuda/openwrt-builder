# ==========================================
# 1. Веб-интерфейс и веб-сервер
# ==========================================
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
CONFIG_PACKAGE_luci-i18n-base-ru=y
CONFIG_PACKAGE_uhttpd=y
CONFIG_PACKAGE_uhttpd-mod-ubus=y

# ==========================================
# 2. VPN и туннели
# ==========================================
# OpenVPN
CONFIG_PACKAGE_openvpn-openssl=y
CONFIG_PACKAGE_luci-app-openvpn=y
CONFIG_PACKAGE_luci-i18n-openvpn-ru=y

# WireGuard
CONFIG_PACKAGE_kmod-wireguard=y
CONFIG_PACKAGE_wireguard-tools=y
CONFIG_PACKAGE_luci-app-wireguard=y
CONFIG_PACKAGE_luci-i18n-wireguard-ru=y

# AmneziaWG (AWG)
CONFIG_PACKAGE_kmod-amneziawg=y
CONFIG_PACKAGE_amneziawg-tools=y
CONFIG_PACKAGE_luci-proto-amneziawg=y

# NetBird

# L2TP (Static / Dynamic)
CONFIG_PACKAGE_xl2tpd=y
CONFIG_PACKAGE_ppp-mod-pppol2tp=y
CONFIG_PACKAGE_luci-proto-ppp=y

# ==========================================
# 3. Обход блокировок (DPI)
# ==========================================
# Zapret & Zapret2
CONFIG_PACKAGE_zapret=y
CONFIG_PACKAGE_luci-app-zapret=y
CONFIG_PACKAGE_luci-i18n-zapret-ru=y

# ==========================================
# 4. Системные сервисы и утилиты
# ==========================================
# Watchcat (автоперезагрузка при зависании интернета)
CONFIG_PACKAGE_luci-app-watchcat=y
CONFIG_PACKAGE_luci-i18n-watchcat-ru=y

# Веб-терминал (ttyd)
CONFIG_PACKAGE_ttyd=y
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-i18n-ttyd-ru=y

# UPnP IGD & PCP
CONFIG_PACKAGE_miniupnpd=y
CONFIG_PACKAGE_luci-app-upnp=y
CONFIG_PACKAGE_luci-i18n-upnp-ru=y

# Динамический DNS (DDNS)
CONFIG_PACKAGE_luci-app-ddns=y
CONFIG_PACKAGE_ddns-scripts=y
CONFIG_PACKAGE_ddns-scripts-cloudflare=y
CONFIG_PACKAGE_ddns-scripts-services=y
CONFIG_PACKAGE_luci-i18n-ddns-ru=y

# Базовые полезные консольные утилиты
CONFIG_PACKAGE_curl=y
CONFIG_PACKAGE_htop=y
CONFIG_PACKAGE_nano=y

# ==========================================
# 5. IPv6 туннели (6in4 / RFC4213)
# ==========================================
CONFIG_PACKAGE_6in4=y
CONFIG_PACKAGE_luci-proto-ipv6=y

# ==========================================
# 6. Тема оформления LuCI
# ==========================================
CONFIG_PACKAGE_luci-theme-openwrt-2020=y

# ==========================================
# 7. Системная оптимизация и производительность
# ==========================================
CONFIG_PACKAGE_kmod-tcp-bbr=y
CONFIG_PACKAGE_zram-swap=y
CONFIG_PACKAGE_irqbalance=y

# ==========================================
# 8. Зависимости для SSClash-Go (Mihomo / TPROXY)
# ==========================================
CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_kmod-nft-tproxy=y
CONFIG_PACKAGE_coreutils-base64=y
CONFIG_PACKAGE_ca-certificates=y

# ==========================================
# 9. Зависимости для FPTN и LaLune
# ==========================================
CONFIG_PACKAGE_ip-full=y

# ==========================================
# 10. Глобальная локализация LuCI (Русский язык)
# ==========================================
CONFIG_LUCI_LANG_ru=y

# ==========================================
# 10. Глобальная локализация LuCI (Русский язык)
# ==========================================
CONFIG_LUCI_LANG_ru=y

# Поддержка NetBird / conntrack для LuCI
CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
CONFIG_PACKAGE_libnetfilter-conntrack=y

# Zapret2 (NFQWS2)
CONFIG_PACKAGE_zapret2=y
CONFIG_PACKAGE_luci-app-zapret2=y
CONFIG_PACKAGE_conntrack=y
CONFIG_PACKAGE_luci-proto-wireguard=y

# ==========================================
# 11. Дополнительные сетевые протоколы
# ==========================================
# Модемы 3G / UMTS / GPRS / EV-DO
CONFIG_PACKAGE_luci-proto-3g=y
CONFIG_PACKAGE_comgt=y

# IPv6 туннели 6rd и 6to4
CONFIG_PACKAGE_6rd=y
CONFIG_PACKAGE_6to4=y

# GRE и GRETAP туннели (IPv4 / IPv6)
CONFIG_PACKAGE_luci-proto-gre=y

# PPtP туннели
CONFIG_PACKAGE_pptp=y

# Мост-ретранслятор (Relay bridge)
CONFIG_PACKAGE_luci-proto-relay=y
CONFIG_PACKAGE_relayd=y

# Mesh-протокол B.A.T.M.A.N. Advanced
CONFIG_PACKAGE_luci-proto-batman-adv=y
CONFIG_PACKAGE_kmod-batman-adv=y
CONFIG_PACKAGE_batctl-default=y

# ==========================================
# 12. Системные утилиты, диски и управление
# ==========================================
# Монтирование разделов (Mount Points) и поддержка накопителей
CONFIG_PACKAGE_luci-app-fstab=y
CONFIG_PACKAGE_block-mount=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-fs-ext4=y
CONFIG_PACKAGE_kmod-fs-vfat=y
CONFIG_PACKAGE_kmod-fs-ntfs3=y

# Пользовательские команды (Custom Commands)
CONFIG_PACKAGE_luci-app-commands=y

# Файловый менеджер
CONFIG_PACKAGE_luci-app-filemanager=y

# QoS и управление приоритетом трафика (SQM + Cake + QoS)
CONFIG_PACKAGE_luci-app-sqm=y
CONFIG_PACKAGE_luci-app-qos=y
CONFIG_PACKAGE_sqm-scripts=y
CONFIG_PACKAGE_kmod-sched-cake=y

# Мониторинг интерфейсов, Пользователи (клиенты сети) и учет трафика
CONFIG_PACKAGE_luci-app-nlbwmon=y
CONFIG_PACKAGE_nlbwmon=y

# Фильтрация сайтов (Web Filtering) и контроль доступа
CONFIG_PACKAGE_luci-app-access-control=y
CONFIG_PACKAGE_luci-app-adblock-fast=y

# Информационная панель и графики статистики
CONFIG_PACKAGE_luci-app-statistics=y
CONFIG_PACKAGE_collectd=y
CONFIG_PACKAGE_collectd-mod-interface=y
CONFIG_PACKAGE_collectd-mod-cpu=y
CONFIG_PACKAGE_collectd-mod-memory=y
CONFIG_PACKAGE_bind-dig=y

# ==========================================
# 13. Ядерные модули компрессии LZ4 (для ZRAM)
# ==========================================
CONFIG_PACKAGE_kmod-lib-lz4=y
CONFIG_PACKAGE_kmod-crypto-lz4=y

# ==========================================
# 14. Системные флаги ядра OpenWrt для ZRAM LZ4
# ==========================================
CONFIG_KERNEL_ZRAM_BACKEND_LZ4=y
CONFIG_KERNEL_ZRAM_DEF_COMP_LZ4=y
CONFIG_KERNEL_ZRAM_BACKEND_ZSTD=y
