# 1. Алгоритм перегрузки и быстрая реакция маршрутизации
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_forward_use_pmtu = 1

# 2. Оптимизация TProxy / SSClash / Local Sockets (быстрое закрытие и reuse)
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 8192
net.core.dev_weight = 64

# 3. Совместимость Conntrack с DPI-десинхронизацией (Zapret 1 & Zapret 2)
net.netfilter.nf_conntrack_tcp_be_liberal = 1
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

# 4. Сетевые буферы (nlbwmon, NetBird, TProxy)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 524288
net.core.wmem_default = 524288
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# 5. Виртуальная память (ZRAM LZ4 + Go Runtime)
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 100
vm.watermark_scale_factor = 125
vm.overcommit_memory = 1
