name: Build Xiaomi AX3600 Firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_repo:
        description: 'Git URL репозитория OpenWrt'
        required: true
        default: 'https://github.com/openwrt/openwrt.git'
      openwrt_commit:
        description: 'Ветка, тег или хэш коммита (по умолчанию ваш f0a60eee2f)'
        required: true
        default: 'f0a60eee2f'
      clean_build:
        description: 'Сборка с нуля (без кэша)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout openwrt-builder
        uses: actions/checkout@v4

      - name: Освобождение места на диске (Free Disk Space)
        run: |
          echo "Очистка ненужных пакетов runner'а..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Установка сборочных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl

      - name: Клонирование OpenWrt дерева
        run: |
          git clone ${{ inputs.openwrt_repo }} openwrt
          cd openwrt
          git checkout ${{ inputs.openwrt_commit }}

      - name: Обновление и установка фидов
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Генерация .config для Xiaomi AX3600
        working-directory: openwrt
        run: |
          cat << 'CONF' > .config
          # Целевая платформа и устройство
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600=y

          # Веб-интерфейс LuCI и SSL
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # Базовые утилиты
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONF

          # Применяем конфигурацию
          make defconfig
          echo "=== Проверка выбранного таргета ==="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' .config

      - name: Загрузка исходников пакетов (make download)
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Сборка прошивки
        working-directory: openwrt
        run: |
          echo "Запуск компиляции на $(nproc) потоках..."
          make -j$(nproc) || make -j1 V=s

      - name: Подготовка артефактов
        working-directory: openwrt
        run: |
          mkdir -p /tmp/firmware_ax3600
          cd bin/targets/qualcommax/ipq807x
          # Копируем образы (factory ubi, sysupgrade bin, манифест и контрольные суммы)
          cp *xiaomi_ax3600* /tmp/firmware_ax3600/ || true
          cp sha256sums /tmp/firmware_ax3600/ || true
          cp *manifest /tmp/firmware_ax3600/ || true
          echo "Готовые файлы:"
          ls -la /tmp/firmware_ax3600/

      - name: Выгрузка прошивки (Upload Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-xiaomi-ax3600-firmware
          path: /tmp/firmware_ax3600/
          retention-days: 14
