name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Выберите устройство для сборки'
        required: true
        type: choice
        options:
          - xiaomi-ax3600
          - xiaomi-ax6000
          - xiaomi-ax6s
          - custom
      custom_card:
        description: 'Если выбрали custom — укажите путь к карточке (например: devices/my-router.yml)'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ inputs.device }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Освобождение диска runner'а
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - name: Установка сборочных пакетов
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget curl

      - name: Определение карточки устройства и версии
        id: info
        run: |
          if [ "${{ inputs.device }}" = "custom" ]; then
            CARD="${{ inputs.custom_card }}"
          else
            CARD="devices/${{ inputs.device }}.yml"
          fi
          if [ ! -f "$CARD" ]; then
            echo "::error::Карточка $CARD не найдена!"
            exit 1
          fi
          echo "card=$CARD" >> $GITHUB_OUTPUT

          # Извлекаем версию (ref_name или первые 8 символов коммита ref)
          VERSION=$(grep -E '^ref_name:' "$CARD" | awk '{print $2}' | sed 's/#.*//' | tr -d ' ')
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^ref:' "$CARD" | awk '{print $2}' | cut -c1-8)
          fi
          [ -z "$VERSION" ] && VERSION="snapshot"

          BUILD_DATE=$(date +'%Y%m%d')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Сборка прошивки через build-one.sh
        run: |
          sh scripts/build-one.sh "${{ steps.info.outputs.card }}" --jobs $(nproc)

      - name: Подготовка архива (без глубоких путей)
        run: |
          mkdir -p release
          # Копируем sysupgrade-образы прямо в папку release без вложенных директорий
          find openwrt/bin/targets/ -type f -name "*sysupgrade.bin" -exec cp -t release/ {} +
          # Генерируем чистую контрольную сумму строго для этих файлов
          cd release
          sha256sum *sysupgrade.bin > sha256sums
          echo "Готовые файлы к выгрузке:"
          ls -la

      - name: Выгрузка готовых прошивок в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.device }}-${{ steps.info.outputs.version }}-${{ steps.info.outputs.build_date }}
          path: release/
          retention-days: 14
