name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Выберите устройство для сборки'
        required: true
        type: choice
        options:
          - xiaomi-ax3600
          - xiaomi-ax6000
          - xiaomi-ax6s
          - custom
      custom_card:
        description: 'Если выбрали custom — укажите путь к карточке (например: devices/my-router.yml)'
        required: false
        default: ''
      publish_release:
        description: 'Опубликовать готовые файлы в GitHub Releases'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build ${{ inputs.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Освобождение дискового пространства
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка зависимостей сборки OpenWrt
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl

      -- name: Определение параметров устройства и версии
        id: info
        run: |
          if [ "${{ inputs.device }}" = "custom" ]; then
            CARD="${{ inputs.custom_card }}"
          else
            CARD="devices/${{ inputs.device }}.yml"
          fi
          if [ ! -f "$CARD" ]; then
            echo "::error::Карточка $CARD не найдена!"
            exit 1
          fi
          echo "card=$CARD" >> $GITHUB_OUTPUT

          case "${{ inputs.device }}" in
            xiaomi-ax3600) DEV_NAME="Xiaomi-AX3600" ;;
            xiaomi-ax6000) DEV_NAME="Xiaomi-AX6000" ;;
            xiaomi-ax6s)   DEV_NAME="Xiaomi-AX6S" ;;
            *)             DEV_NAME="${{ inputs.device }}" ;;
          esac
          echo "dev_name=$DEV_NAME" >> $GITHUB_OUTPUT

          VERSION=$(grep -E '^ref_name:' "$CARD" | awk '{print $2}' | sed -e 's/#.*//' -e 's/[^a-zA-Z0-9._-]//g')
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^ref:' "$CARD" | awk '{print $2}' | sed 's/[^a-zA-Z0-9._-]//g' | cut -c1-8)
          fi
          [ -z "$VERSION" ] && VERSION="snapshot"

          BUILD_DATE=$(date +'%Y%m%d')
          RELEASE_DATE=$(date +'%m.%d.%y')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT

      - name: Сборка прошивки через build-one.sh
        run: |
          sh scripts/build-one.sh "${{ steps.info.outputs.card }}" --jobs $(nproc)

      - name: Подготовка архива
        run: |
          mkdir -p release
          # Копируем все собранные образы прошивки
          find openwrt/bin/targets/ -type f \( -name "*sysupgrade.bin" -o -name "*factory.bin" -o -name "*initramfs*.bin" \) -exec cp -t release/ {} +
          
          if [ -z "$(ls -A release/ 2>/dev/null)" ]; then
            echo "::error::Не найдено ни одного файла прошивки в openwrt/bin/targets/!"
            exit 1
          fi
          
          cd release
          sha256sum * > sha256sums
          echo "Готовые файлы к выгрузке:"
          ls -la

      - name: Выгрузка готовых прошивок в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.device }}-${{ steps.info.outputs.version }}-${{ steps.info.outputs.build_date }}
          path: release/
          retention-days: 14

      - name: Публикация прошивки в GitHub Releases
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.device }}-${{ steps.info.outputs.version }}-${{ steps.info.outputs.build_date }}
          name: "${{ steps.info.outputs.dev_name }} OpenWrt ${{ steps.info.outputs.version }} (${{ steps.info.outputs.release_date }})"
          body: |
            ## Релиз OpenWrt 25.12 для ${{ steps.info.outputs.dev_name }}

            * **Базовый коммит:** `58efa9917d4cc53fceed173529a286187649e827` (тег `${{ steps.info.outputs.version }}`)
            * **Ядро Linux:** 6.12.112 (ARM64 Cortex-A53)

            ### Контрольные суммы SHA-256
            Файл `sha256sums` прикреплён к релизу.
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
